# 能力地图薄数据层（人工维护的唯一部分）
# 规则明细（id/severity/语言/taint形态/e2e覆盖/孪生yaml）由
# scripts/gen_capability_map.py 从规则库自动推导，本文件只登记
# 自动推导无法获知的两层信息：
#   quality_level —— 该类别的质量阶梯等级（L0-L3，判定标准见 blueprint.md）
#   blind_test   —— 靶场验证凭证（target: TP/FP 记录或 null）
# 更新时机：每完成一批规则（批次 SOP 第 8 步），只改本文件 + 重跑生成器。

categories:
  - cwe: CWE-89
    name: SQL 注入
    owasp: A03
    quality_level: L3
    blind_test:
      target: java-sec-code
      result: "taint 4 TP + 0 FP（JDBC/JPA 全中，PreparedStatement 加固豁免）"
      target2: WebGoat
      result2: "sqli-taint 2 TP + 0 FP（Assignment5/SqlInjectionChallenge 经典拼接全中）"
  - cwe: CWE-22
    name: 路径穿越
    owasp: A01
