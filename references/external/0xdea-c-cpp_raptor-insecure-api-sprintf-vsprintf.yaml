rules:
- id: raptor-insecure-api-sprintf-vsprintf
  languages:
  - c
  - cpp
  message: A buffer overflow condition exists when a program attempts to put more
    data in a buffer than it can hold, or when a program attempts to put data in a
    memory area outside of the boundaries of a buffer.
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-676: Use of Potentially Dangerous Function'
    - 'CWE-120: Buffer Copy without Checking Size of Input (''Classic Buffer Overflow'')'
    - 'CWE-787: Out-of-bounds Write'
    impact: HIGH
    likelihood: HIGH
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://g.co/kgs/PCHQjJ
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    vulnerability_class: Dangerous Method or Function
  patterns:
  - pattern-either:
    - pattern: sprintf($_, $FMT, ...)
    - pattern: vsprintf($_, $FMT, ...)
  - metavariable-regex:
      metavariable: $FMT
      regex: (".*%l?s.*"|".*%S.*"|[a-zA-Z_][a-zA-Z0-9_]*)
  severity: ERROR
