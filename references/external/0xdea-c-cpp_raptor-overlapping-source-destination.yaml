rules:
- id: raptor-overlapping-source-destination
  languages:
  - c
  - cpp
  message: C standards specify that the results are undefined if a call to copy functions,
    with the exception of memmove(), would cause copying to take place between objects
    that overlap (e.g., if the target string array and one of the supplied input arguments
    refer to the same buffer).
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-1260: Improper Handling of Overlap Between Protected Memory Ranges'
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://linux.die.net/man/3/sprintf
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    vulnerability_class: Memory Issues
  pattern-either:
  - patterns:
    - pattern: $FUN($DST, $DST, ...)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: strcpy
        - pattern: strncpy
        - pattern: stpcpy
        - pattern: stpncpy
        - pattern: strlcpy
        - pattern: strscpy
        - pattern: wcscpy
        - pattern: wcsncpy
        - pattern: wcpcpy
        - pattern: wcpncpy
        - pattern: wcslcpy
        - pattern: _mbscpy
        - pattern: _mbsncpy
        - pattern: _mbpcpy
        - pattern: _mbpncpy
        - pattern: _mbslcpy
        - pattern: strccpy
        - pattern: strcadd
        - pattern: streadd
        - pattern: strecpy
        - pattern: strcat
        - pattern: strncat
        - pattern: strlcat
        - pattern: wcscat
        - pattern: wcsncat
        - pattern: wcslcat
        - pattern: _mbscat
        - pattern: _mbsncat
        - pattern: _mbslcat
        - pattern: memcpy
        - pattern: memccpy
        - pattern: wmemcpy
        - pattern: mempcpy
        - pattern: wmempcpy
        - pattern: bcopy
  - pattern: sprintf($DST, ..., $DST, ...)
  - pattern: snprintf($DST, $_, ..., $DST, ...)
  severity: WARNING
