rules:
- id: raptor-interesting-api-calls
  languages:
  - c
  - cpp
  message: Locate all calls to interesting and potentially insecure API functions
    (candidate points). The auditor can backtrace from these candidate points to find
    pathways allowing access from untrusted input.
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-676: Use of Potentially Dangerous Function'
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://github.com/0xdea/rhabdomancer
    - https://github.com/0xdea/ghidra-scripts/blob/main/Rhabdomancer.java
    - https://github.com/x509cert/banned/blob/master/banned.h
    - https://g.co/kgs/PCHQjJ
    - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    - https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/28719-banned-api-usage-use-updated-function-replacement
    - https://docs.oracle.com/cd/E37838_01/html/E61050/gnclc.html
    subcategory:
    - audit
    technology:
    - c
    - cpp
    vulnerability_class: Dangerous Method or Function
  pattern-either:
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*set\w*(u|g)id\s*$|^\w*(init|set)groups\s*$|^\w*Impersonate\w*\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*str\w?(cpy|add)(_s)?(_l)?\s*$|^\w*stpn?cpy(_s)?(_l)?\s*$|^\w*(wc|mb|ftc|tc)s\w?cpy(_s)?(_l)?\s*$|^\w*wcpn?cpy(_s)?(_l)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*str\w?cat(_s)?(_l)?\s*$|^\w*(wc|mb|ftc|tc)s\w?cat(_s)?(_l)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*strtok(_r)?(_s)?(_l)?\s*$|^\w*(wc|mb)stok(_r)?(_s)?(_l)?\s*$|^\w*str(find|rspn|trns)\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*s\w*printf(_s)?(_l)?\w*\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*scanf(_s)?(_l)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*get(s|ws(_l)?|ts|tws|c|char|pw|pass|wd|cwd|login(_r)?|groups|hostname|domainname|opt|opt_long)\s*$|^\w*cuserid\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*(get|set|put|unset)env\s*$|^\w*g_get_(home|tmp)_dir\s*$
  - patterns:
    - pattern: $FUN($_, $_, $LEN, ...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*mem(c|p)?cpy(_s)?\s*$|^\w*memmove(_s)?\s*$|^\w*bcopy\s*$|^\w*CopyMemory\s*$
    - pattern-not: $FUN($_, $_, sizeof(...), ...)
    - metavariable-regex:
        metavariable: $LEN
        regex: ^(?!\s*(?:0[xX][0-9A-Fa-f]+|0[bB][01]+|0[0-7]*|[1-9][0-9]*)[uUlL]*\s*$).+
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*alloc(a|f)?\s*$|^\w*alloc_?array\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*exec(l|v)?(p|e)?e?\s*$|^\w*system\s*$|^\w*spawn\w?\s*$|^\w*wordexp\s*$|^\w*WinExec\s*$|^\w*ShellExecute(A|ExA|W|ExW)?\s*$|^\w*CreateProcess(A|AsUserA|W|AsUserW|WithLogonW|WithTokenW)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*open(at)?(64)?\s*$|^\w*pipe\s*$|^\w*read\s*$|^\w*recv(from)?\s*$|^\w*copylist\s*$|^\w*dbminit\s*$|^\w*LoadLibrary(A|ExA|W|ExW)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*fork\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*rand(_r|48)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*mk\w?temp(64)?\s*$|^\w*te?mpnam(_r)?\s*$|^\w*tmpfile\s*$|^\w*GetTempFileName(A|W)?\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*(mk|ch)(dir|nod)(at)?\s*$|^\w*creat\s*$|^\w*link(at)?\s*$|^\w*rename(at)?\s*$|^\w*access(at|at2|_ok)?\s*$|^\w*stat(at)?\s*$|^\w*ch(own|mod|root)(at)?\s*$|^\w*realpath\s*$|^\w*readlink(at)?\s*$|^\w*(tty|pts)name_r\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*locale\s*$|^\w*(make|split)path\s*$|^\w*fattach\s*$|^\w*ftw\s*$|^\w*truncate\s*$|^\w*u(mask|limit)\s*$|^\w*AddAccessAllowedAce\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*confstr\s*$|^\w*utmpx?name\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*mbs(nr|r)?towcs(_l)?\s*$|^\w*wcs(nr|r)?tombs(_l)?\s*$|^\w*OemToCharW\s*$|^\w*MultiByteToWideChar\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*inet_(ntop|pton)\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*cftime\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*syscall\s*$
  - patterns:
    - pattern: $FUN(...)
    - metavariable-regex:
        metavariable: $FUN
        regex: (?i)^\w*copy_(from|to)_user\s*$|^\w*(get|put)_user\s*$|^\w*copy(in|out)\s*$|^\w*cdev_init\s*$
  severity: WARNING
