rules:
- id: raptor-integer-wraparound
  languages:
  - c
  - cpp
  message: The software performs a calculation that can produce an integer overflow
    or wraparound, when the logic assumes that the resulting value will always be
    larger than the original value. This can introduce other weaknesses when the calculation
    is used for resource management or execution control.
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-190: Integer Overflow or Wraparound'
    - 'CWE-128: Wrap-around Error'
    - 'CWE-131: Incorrect Calculation of Buffer Size'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A10:2025 - Mishandling of Exceptional Conditions
    references:
    - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    - http://www.phrack.org/issues/60/10.html#article
    - https://docs.microsoft.com/en-us/cpp/sanitizers/asan-error-examples
    - https://dustri.org/b/playing-with-weggli.html
    subcategory:
    - vuln
    technology:
    - c
    - cpp
    vulnerability_class: Memory Issues
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $FUN($_ * $_)
      - pattern: $FUN($_ *= $_)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: malloc
        - pattern: valloc
  - patterns:
    - pattern: $FUN($N)
    - pattern-either:
      - pattern-inside: '$N = $_ * $_;

          ...

          '
      - pattern-inside: '$N *= $_;

          ...

          '
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: malloc
        - pattern: valloc
  - patterns:
    - pattern-either:
      - pattern: $FUN($_ + $_)
      - pattern: $FUN($_ += $_)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: malloc
        - pattern: valloc
  - patterns:
    - pattern: $FUN($N)
    - pattern-either:
      - pattern-inside: '$N = $_ + $_;

          ...

          '
      - pattern-inside: '$N += $_;

          ...

          '
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: malloc
        - pattern: valloc
  - patterns:
    - pattern-either:
      - pattern: $FUN($_, $_ * $_, ...)
      - pattern: $FUN($_, $_ *= $_, ...)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
        - pattern: realloc
        - pattern: reallocf
        - pattern: aligned_alloc
        - pattern: VirtualAlloc
  - patterns:
    - pattern: $FUN($_, $N, ...)
    - pattern-either:
      - pattern-inside: '$N = $_ * $_;

          ...

          '
      - pattern-inside: '$N *= $_;

          ...

          '
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
        - pattern: realloc
        - pattern: reallocf
        - pattern: aligned_alloc
        - pattern: VirtualAlloc
  - patterns:
    - pattern-either:
      - pattern: $FUN($_, $_ + $_, ...)
      - pattern: $FUN($_, $_ += $_, ...)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
        - pattern: realloc
        - pattern: reallocf
        - pattern: aligned_alloc
        - pattern: VirtualAlloc
  - patterns:
    - pattern: $FUN($_, $N, ...)
    - pattern-either:
      - pattern-inside: '$N = $_ + $_;

          ...

          '
      - pattern-inside: '$N += $_;

          ...

          '
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
        - pattern: realloc
        - pattern: reallocf
        - pattern: aligned_alloc
        - pattern: VirtualAlloc
  - patterns:
    - pattern-either:
      - pattern: $FUN($_ * $_, $_)
      - pattern: $FUN($_ *= $_, $_)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
  - patterns:
    - pattern: $FUN($N, $_)
    - pattern-either:
      - pattern-inside: '$N = $_ * $_;

          ...

          '
      - pattern-inside: '$N *= $_;

          ...

          '
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
  - patterns:
    - pattern-either:
      - pattern: $FUN($_ + $_, $_)
      - pattern: $FUN($_ += $_, $_)
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
  - patterns:
    - pattern: $FUN($N, $_)
    - pattern-either:
      - pattern-inside: '$N = $_ + $_;

          ...

          '
      - pattern-inside: '$N += $_;

          ...

          '
    - metavariable-pattern:
        metavariable: $FUN
        pattern-either:
        - pattern: calloc
  - pattern: $X > $MAX || ($X + $_) > $MAX
  - pattern: $X >= $MAX || ($X + $_) > $MAX
  - pattern: $X > $MAX || ($X + $_) >= $MAX
  - pattern: $X >= $MAX || ($X + $_) >= $MAX
  - pattern: $X < $MAX && ($X + $_) < $MAX
  - pattern: $X <= $MAX && ($X + $_) < $MAX
  - pattern: $X < $MAX && ($X + $_) <= $MAX
  - pattern: $X <= $MAX && ($X + $_) <= $MAX
  - pattern: $X > $MAX || ($X * $_) > $MAX
  - pattern: $X >= $MAX || ($X * $_) > $MAX
  - pattern: $X > $MAX || ($X * $_) >= $MAX
  - pattern: $X >= $MAX || ($X * $_) >= $MAX
  - pattern: $X < $MAX && ($X * $_) < $MAX
  - pattern: $X <= $MAX && ($X * $_) < $MAX
  - pattern: $X < $MAX && ($X * $_) <= $MAX
  - pattern: $X <= $MAX && ($X * $_) <= $MAX
  severity: WARNING
