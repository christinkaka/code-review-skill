rules:
- id: raptor-typos
  languages:
  - c
  - cpp
  message: The programmer accidentally uses the wrong operator, which changes the
    application logic in security-relevant ways. This rule also covers some other
    common typo patterns.
  metadata:
    author: Marco Ivaldi <raptor@0xdeadbeef.info>
    category: security
    confidence: LOW
    cwe:
    - 'CWE-480: Use of Incorrect Operator'
    - 'CWE-481: Assigning instead of Comparing'
    - 'CWE-482: Comparing instead of Assigning'
    - 'CWE-483: Incorrect Block Delimitation'
    - 'CWE-705: Incorrect Control Flow Scoping'
    - 'CWE-561: Dead Code'
    - 'CWE-1164: Irrelevant Code'
    impact: LOW
    likelihood: LOW
    owasp:
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://g.co/kgs/PCHQjJ
    - https://www.sei.cmu.edu/downloads/sei-cert-c-coding-standard-2016-v01.pdf
    subcategory:
    - audit
    technology:
    - c
    - cpp
    vulnerability_class: Other Security
  pattern-either:
  - pattern: for ($_ == $_; $_; $_) ...
  - patterns:
    - pattern: $_ == $_;
    - pattern-not-inside: return $_;
    - pattern-not-inside: assert(...);
  - patterns:
    - pattern: if (<... $EXPR1 = $EXPR2 ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 = $EXPR2) == $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 = $EXPR2) != $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 = $EXPR2) < $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 = $EXPR2) <= $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 = $EXPR2) > $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 = $EXPR2) >= $_ ...>) ...
  - patterns:
    - pattern: if (<... $EXPR1 & $EXPR2 ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 & $EXPR2) == $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 & $EXPR2) != $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 & $EXPR2) < $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 & $EXPR2) <= $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 & $EXPR2) > $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 & $EXPR2) >= $_ ...>) ...
  - patterns:
    - pattern: if (<... $EXPR1 | $EXPR2 ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 | $EXPR2) == $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 | $EXPR2) != $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 | $EXPR2) < $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 | $EXPR2) <= $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 | $EXPR2) > $_ ...>) ...
    - pattern-not-inside: if (<... ($EXPR1 | $EXPR2) >= $_ ...>) ...
  - pattern: $_ =+ $_
  - pattern: ($EXPR && $EXPR)
  - pattern: ($EXPR || $EXPR)
  - pattern: ($EXPR == $EXPR)
  - pattern: ($EXPR != $EXPR)
  - pattern: ($EXPR < $EXPR)
  - pattern: ($EXPR <= $EXPR)
  - pattern: ($EXPR > $EXPR)
  - pattern: ($EXPR >= $EXPR)
  - pattern: (char * $_) = '\0'
  - pattern: (char * $_) == '\0'
  - pattern: (char * $_) != '\0'
  - pattern: if (<... strcpy(...) ...>) ...
  - pattern: if (<... strncpy(...) ...>) ...
  - pattern: if ($_);
  - pattern: for ($_; $_; $_);
  - patterns:
    - pattern-either:
      - pattern: $_ $_[$LEN];
      - pattern: $_ $_[$LEN] = ...;
    - metavariable-regex:
        metavariable: $LEN
        regex: ^0[^xX].*
  severity: INFO
