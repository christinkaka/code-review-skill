# 安全规约 - 硬编码密钥检测
# CWE-798: Use of Hard-coded Credentials
# OWASP: A07:2021 - Identification and Authentication Failures

rules:
  - id: crypto-hardcoded-key
    languages: [java, python, javascript, typescript]
    pattern-regex: (?i)(password|secret|api_?key|token|api_?secret)\s*=\s*["'][^"']{8,}["']
    message: >
      [硬编码密钥] 敏感信息（密码、密钥、令牌）硬编码在源代码中。
      攻击者获取源码后可直接获取敏感凭据。
      使用环境变量或密钥管理服务（KMS/Vault）替代。
    severity: HIGH
    category: security
    metadata:
      cwe: CWE-798
      owasp: "A07:2021"
      confidence: MEDIUM

  - id: crypto-hardcoded-key-java
    languages: [java]
    patterns:
      - pattern: |
          String $VAR = "...";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|secret|api_?key|token).*
    message: >
      [硬编码密钥] 敏感信息硬编码在 Java 字符串变量中。
      使用环境变量或密钥管理服务（KMS/Vault）替代。
    severity: HIGH
    category: security
    metadata:
      cwe: CWE-798
      owasp: "A07:2021"
      confidence: HIGH
