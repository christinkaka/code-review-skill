repos:
- name: example-project
  path: ./repos/example-project
  url: ''
  base_branch: master
  target_branch: release/1.0
  language: java
  profile: default
specs_dir: references
output:
  dir: report
  format: both
  include_fix: true
  include_call_chain: true
  include_ai_analysis: true
review:
  mode: hybrid
  agent:
    context_aware: true
    generate_fix: true
    generate_analysis: true
  subagent:
    enabled: true
    temperature:
      security: 0.1
      quality: 0.2
      performance: 0.1
      architecture: 0.2
      comprehensive: 0.1
semgrep:
  enabled: true
  binary: ''
  timeout: 300
  max_memory: 4096
  extra_args: []
call_graph:
  analyzer: tree-sitter
  max_depth: 5
  include_affected: true
schedule:
  cron: 0 2 * * *
  notify: false
  notify_method: none
  notify_target: ''
logging:
  level: INFO
  file: logs/scan.log
performance:
  incremental: true
  parallel_files: 4
  batch_size: 50
  skip_tests: true
  skip_generated: true
exclude:
- '**/test/**'
- '**/tests/**'
- '**/__tests__/**'
- '**/generated/**'
- '**/target/**'
- '**/build/**'
- '**/node_modules/**'
- '**/.git/**'
- '**/vendor/**'
prefilter:
  enabled: true
  rules:
    sqli-mybatis-dollar:
      enabled: true
      description: Maven pom.xml 中的 ${} 是属性占位符，不是 SQL 注入
      filter_condition: file ends with pom.xml or .xml, and code_snippet contains
        ${
    crypto-hardcoded-key-java:
      enabled: true
      description: Constants 类中的配置项 key（如 "password" 作为配置键名），非真实密钥
      filter_condition: file contains Constants or constants directory
    naming-*:
      enabled: true
      description: 命名风格偏好，不是安全/质量缺陷
      filter_condition: rule_id starts with naming-
    short-code-snippet:
      enabled: true
      description: code_snippet 长度 < 5 行，上下文太少，AI 判断不可靠
      filter_condition: code_snippet lines < 5
